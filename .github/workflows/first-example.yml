name: My First Workflow

on: push

jobs: 
    first-job:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: LIst and read and welcome and date
          run: |
            echo "Welcome to my first GitHub Actions workflow!"
            date
            ls -la
            cat README.md
        - name: Generate ASCII Art
          run: cowsay -f dragon "Run for cover, it's a dragon!" >> dragon.txt

       